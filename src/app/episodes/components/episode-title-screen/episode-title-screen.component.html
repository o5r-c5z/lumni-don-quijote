@if (episode) {
  <h1 class="cdk-visually-hidden">{{ episode.title }}</h1>
  <nav class="episode-title-screen__links">
    <a
      #goToEpisodeButton
      [routerLink]="['video']"
      class="btn btn-plain"
      tabindex="0"
    >
      Accès à l'épisode
    </a>
    <a [routerLink]="['quiz']" class="btn btn-plain" tabindex="0">
      Accès au quiz de l'épisode
    </a>
  </nav>
}
