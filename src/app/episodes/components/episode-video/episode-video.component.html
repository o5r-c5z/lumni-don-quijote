<div #playerContainer id="episode-video__player-container"></div>
@if (!videoEnded) {
  @if (videoType === undefined) {
    <a
      class="btn btn-plain"
      [routerLink]="['../video']"
      [queryParams]="{ videoType: VideoType.Lesson }"
    >
      Passer la vidéo
    </a>
  } @else {
    <a
      id="episode-video__exit-btn"
      class="btn btn-plain"
      (click)="restartBackgroundMusic()"
      [routerLink]="[exitLink]"
      tabindex="0"
    >
      Passer la vidéo
    </a>
  }
} @else {
  <nav class="episode-video__nav" aria-label="Options après la vidéo">
    <a
      id="episode-video__go-to-quiz-btn"
      class="btn btn-plain"
      [routerLink]="['../quiz']"
    >
      Lancer le quiz !
    </a>
    <button
      type="button"
      class="btn btn-plain"
      (click)="restartVideo()"
    >
      <fa-icon [icon]="faArrowRotateLeft" aria-hidden="true"></fa-icon>
      Revoir toute la vidéo
    </button>
  </nav>
}
